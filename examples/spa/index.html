<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drop SPA example</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f6f5;
        color: #171514;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #100f0e; color: #f3f1ef; }
        a { color: #ff5878; }
      }
      main { width: min(32rem, 90vw); }
      nav { display: flex; gap: 1rem; margin-bottom: 1.5rem; }
      a { color: #c02748; }
      a[aria-current="page"] { font-weight: 600; text-decoration: none; }
      code { font-family: ui-monospace, Menlo, monospace; font-size: 0.875rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a href="./" data-route="/">Home</a>
        <a href="./about" data-route="/about">About</a>
      </nav>
      <div id="view"></div>
      <p><code id="where"></code></p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
